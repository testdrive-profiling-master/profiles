[QEMU]
TITLE					= "Linux"
;x86_64(default), aarch64, riscv64, ppc64
;SYSTEM					= x86_64
ACCELERATION			= whpx
SMP_SIZE				= 2
MEMORY_SIZE				= 6G
FULL_SCREEN				= false
VGA						= virtio
DISPLAY					= sdl,gl=on
HARD_DISK_IMAGE			= qemu_testdrive.qcow2
HARD_DISK_SIZE			= 50G
BOOT_FROM_CDROM			=false
CDROM_IMAGE				= linuxmint-22.3-cinnamon-64bit.iso
KERNEL_IMAGE			=
RAM_DISK_IMAGE			=
BOOT_COMMAND			=
EXTRA_OPTIONS			= -cpu host,svm=off,hv_relaxed,hv_spinlocks=0xfff,hv_vapic,hv_time -netdev user,id=net0,smb=D:/Download -device virtio-net-pci,netdev=net0 -usb -device usb-tablet
;refresh will be occur every 100 days
;AUTO_REFRESH_DAYS		= 100

[TESTDRIVE_DEVICE]
MAIN_VENDOR_ID			= 0x1234
MAIN_DEVICE_ID			= 0x0000
SUB_VENDOR_ID			= 0x0000
SUB_DEVICE_ID			= 0x0000
CLASS_ID				= 0x0780
REVISION				= 0x00
;ROM_FILE				= testdrive_device.rom
SETUP_SCRIPT			= ../testdrive_device_setup.lua
